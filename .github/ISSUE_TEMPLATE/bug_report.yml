name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do **not** use this form for security issues — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
      placeholder: I expected the counter to reset at midnight, but it still showed yesterday's total.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Please be as specific as you can, and say whether it happens every time.
      placeholder: |
        1. Tap 20 times in the evening
        2. Close the laptop lid overnight
        3. Open it the next morning and click the menu bar icon
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "15.3"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Idle Tapper version
      description: Shown at the top of the Settings window.
      placeholder: "0.1.0 (1)"
    validations:
      required: true

  - type: input
    id: timezone
    attributes:
      label: Time zone
      description: Especially important for anything involving the daily reset.
      placeholder: "Asia/Bangkok (UTC+7)"

  - type: dropdown
    id: sleep
    attributes:
      label: Had the Mac been asleep?
      description: Relevant for daily-reset issues.
      options:
        - "Not relevant to this bug"
        - "No, it was awake the whole time"
        - "Yes, it had been asleep"
        - "Not sure"

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: |
        Optional. Open Console.app, filter by subsystem `com.kkpon3.IdleTapper`, and paste anything relevant.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not already been reported
          required: true
